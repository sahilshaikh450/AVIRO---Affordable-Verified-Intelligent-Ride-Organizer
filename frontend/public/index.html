<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Dark bars, matching the app header and bottom nav -->
    <meta name="theme-color" content="#161A22" />
    <meta name="description" content="AVIRO - Affordable Verified Intelligent Ride Organizer. Pune's #1 College Ride Sharing Platform." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AVIRO" />

    <!-- PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/icon-192.png" />

    <title>AVIRO — College Ride Sharing Pune</title>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background-color: #0D0F14;
        color: #f0f2f8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      #root { min-height: 100vh; }
      /* Loading screen */
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0D0F14;
        gap: 16px;
      }
      .app-loading-logo {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .app-loading p {
        color: #8b93a8;
        font-size: 14px;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run AVIRO.</noscript>
    <div id="root">
      <!-- Initial loading screen before React loads -->
      <div class="app-loading">
        <img class="app-loading-logo" src="%PUBLIC_URL%/icon-192.png" alt="AVIRO" />
        <p>Loading AVIRO...</p>
      </div>
    </div>
  </body>
</html>
