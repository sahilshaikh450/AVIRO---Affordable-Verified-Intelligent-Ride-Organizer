    <title>AVIRO — College Ride Sharing Pune</title>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background-color: #FFFFFF;
        color: #000000;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      #root { min-height: 100vh; }
      /* Loading screen */
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #FFFFFF;
        gap: 16px;
      }
      .app-loading-logo {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .app-loading p {
        color: #8b93a8;
        font-size: 14px;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      /* Opening animation: a pin drops, then becomes the dot of the "i". Once per visit. */
      #splash { position: fixed; inset: 0; z-index: 9999; background: #FFFFFF; overflow: hidden; transition: opacity .35s ease; }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .stage { position: absolute; left: 50%; top: 50%; width: 390px; height: 844px; margin: -422px 0 0 -195px; }
      #splash .glow { position: absolute; left: 50%; top: 46%; width: 520px; height: 520px; transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(0,0,0,.06), rgba(0,0,0,0) 60%); opacity: 0; animation: sp-fade .8s ease-out 1.3s forwards; }
      #splash .bigpin { position: absolute; left: 50%; top: 250px; width: 70px; margin-left: -35px; animation: sp-drop .7s cubic-bezier(.3,1.5,.5,1) .1s both, sp-shrink .45s ease-in 1.05s forwards; }
      #splash .ripple { position: absolute; left: 50%; top: 340px; width: 120px; height: 34px; margin-left: -60px; border: 3px solid #000; border-radius: 50%; opacity: 0; animation: sp-rip .9s ease-out .7s; }
      #splash .brand { position: absolute; left: 0; right: 0; top: 360px; display: flex; flex-direction: column; align-items: center; }
      #splash .wm { width: 190px; height: auto; overflow: visible; }
      #splash .letters { opacity: 0; animation: sp-up .55s 1.25s forwards; }
      #splash .pin { opacity: 0; animation: sp-fade .25s 1.45s forwards; }
      #splash .bar { margin-top: 12px; height: 5px; width: 0; border-radius: 3px; background: #000; animation: sp-bar .5s 1.6s forwards; }
      #splash .tag { margin-top: 14px; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .32em; color: #6B6B6B; font-weight: 600; opacity: 0; animation: sp-up .5s 1.95s forwards; }
      #splash .tag i { display: block; width: 22px; height: 3px; border-radius: 2px; background: #000; }
      @keyframes sp-fade { to { opacity: 1; } }
      @keyframes sp-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes sp-drop { from { transform: translateY(-320px); } to { transform: none; } }
      @keyframes sp-shrink { to { transform: translateY(118px) scale(.32); opacity: 0; } }
      @keyframes sp-rip { 0% { opacity: .9; transform: scale(.2); } 100% { opacity: 0; transform: scale(1.8); } }
      @keyframes sp-bar { to { width: 120px; } }
    </style>
  </head>

    <script>
      // Play once per visit; skip it for reduce-motion; a tap skips it too
      (function () {
        var el = document.getElementById('splash');
        var seen = false;
        try { seen = sessionStorage.getItem('aviro_splash') === '1'; sessionStorage.setItem('aviro_splash', '1'); } catch (e) {}
        var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (seen || still) { el.parentNode.removeChild(el); return; }
        var done = false;
        function hide() {
          if (done) return; done = true;
          el.className = 'out';
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
        }
        el.addEventListener('click', hide);
        setTimeout(hide, 2600);
      })();
    </script>

    <div id="root">
      <!-- Initial loading screen before React loads -->
      <div class="app-loading">
        <img class="app-loading-logo" src="%PUBLIC_URL%/icon-192.png" alt="AVIRO" />
        <p>Loading AVIRO...</p>
      </div>
    </div>
