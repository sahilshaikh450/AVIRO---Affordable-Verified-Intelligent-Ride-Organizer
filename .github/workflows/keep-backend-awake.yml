# Render free tier puts the backend to sleep after 15 minutes without traffic,
# and waking it takes minutes. Ping it every 10 minutes so it stays awake.
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 \
            "${BACKEND_URL:-https://aviro-affordable-verified-intelligent.onrender.com}/api/health"
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
