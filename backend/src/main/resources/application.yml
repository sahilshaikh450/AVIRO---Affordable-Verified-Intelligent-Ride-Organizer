server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: aviro-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

aviro:
  jwt:
    secret: ${AVIRO_JWT_SECRET}
    expiration: ${AVIRO_JWT_EXPIRATION:86400000}
    refresh-expiration: ${AVIRO_JWT_REFRESH_EXPIRATION:604800000}

  otp:
    expiry-minutes: 10
    length: 6

  ride:
    max-search-radius-km: 5.0
    route-match-threshold: 0.7

  claude:
    api-key: ${GEMINI_API_KEY:}
