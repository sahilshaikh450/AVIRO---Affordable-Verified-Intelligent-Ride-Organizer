server:
  port: ${PORT:10000}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html
    min-response-size: 1024
  servlet:
    context-path: /api

spring:
  application:
    name: aviro-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      max-lifetime: 300000
      keepalive-time: 120000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: true
      timeout: 2s
      connect-timeout: 3s

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        debug: false
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  send-default-pii: false

aviro:
  mail:
    brevo-api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:AVIRO}
    admin-alerts: ${AVIRO_ADMIN_ALERT_EMAIL:aviro.pune.app@gmail.com}

  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:aviro.pune.app@gmail.com}

  jwt:
    secret: ${AVIRO_JWT_SECRET}
    expiration: ${AVIRO_JWT_EXPIRATION:86400000}
    refresh-expiration: ${AVIRO_JWT_REFRESH_EXPIRATION:604800000}

  otp:
    expiry-minutes: 10
    length: 6

  ride:
    max-price-per-seat: ${AVIRO_MAX_PRICE_PER_SEAT:500}
    first-departure: ${AVIRO_FIRST_DEPARTURE:06:00}
    last-departure: ${AVIRO_LAST_DEPARTURE:20:00}
    max-search-radius-km: 5.0
    route-match-threshold: 0.7

  vehicle:
    require-verification: ${AVIRO_REQUIRE_VEHICLE_VERIFICATION:false}

  claude:
    api-key: ${GEMINI_API_KEY:}
